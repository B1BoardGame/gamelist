    </style>
</head>


<body>

<div class="page">

    <main class="container">

        <!-- =====================================================
             프로필
             ===================================================== -->

        <section class="profile">

            <div
                class="profile-image"
                id="profileImage"
                aria-hidden="true"
            >
            </div>

            <h1
                class="profile-name"
                id="profileName"
            ></h1>

            <p
                class="profile-description"
                id="profileDescription"
            ></p>

        </section>


        <!-- =====================================================
             링크 목록

             실제 링크는 JavaScript의 LINKS 배열에서
             자동으로 생성됩니다.
             ===================================================== -->

        <nav
            class="links"
            id="links"
            aria-label="링크 목록"
        ></nav>


        <!-- =====================================================
             Footer
             ===================================================== -->

        <footer
            class="footer"
            id="footer"
        ></footer>

    </main>

</div>


<script>
    /* ============================================================
       ============================================================
       
       ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
       ★
       ★  여기부터가 실제로 수정할 부분입니다.
       ★
       ★  사이트 내용과 링크를 변경할 때
       ★  아래의 SITE와 LINKS만 수정하면 됩니다.
       ★
       ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
       
       ============================================================
       ============================================================ */


    /* ============================================================
       사이트 기본 정보
       ============================================================ */

    const SITE = {

        // 사이트 이름
        name: "B1보드게임카페 부평구청점",

        // 소개 문구
        // 줄바꿈이 필요하면 <br> 사용
        description:
            "1000가지가 넘는 게임들을<br>365일 24시간 즐기실 수 있습니다.",

        // 프로필 이미지
        //
        // 이미지가 없으면 ""로 두면 됩니다.
        //
        // 예:
        // image: "https://example.com/profile.jpg"
        //
        // 또는 같은 폴더에 image.jpg가 있다면
        // image: "profile.jpg"
        //
        image: "",

        // 프로필 이미지가 없을 때 표시할 아이콘
        placeholderIcon: "🎲",

        // Footer
        footer: "B1보드게임카페 부평구청점"
    };


    /* ============================================================
       링크 목록
       
       ★ 링크를 추가할 때는 아래 형식을 그대로 복사하세요.
       
       {
           title: "링크 이름",
           url: "https://example.com",
           icon: "🔗",
           description: "간단한 설명",
           enabled: true
       },
       
       ★ 삭제하고 싶으면 해당 블록 전체를 삭제하면 됩니다.
       
       ★ 잠시 숨기고 싶으면
       
           enabled: false
       
       로 변경하면 됩니다.
       
       ============================================================ */

    const LINKS = [

        {
            title: "카카오맵",
            url: "https://map.kakao.com/",
            icon: "🗺️",
            description: "B1보드게임카페 위치 확인",
            enabled: true
        },


        {
            title: "네이버지도",
            url: "https://map.naver.com/",
            icon: "📍",
            description: "B1보드게임카페 위치 확인",
            enabled: true
        },


        {
            title: "Instagram",
            url: "https://www.instagram.com/",
            icon: "📷",
            description: "B1보드게임카페 인스타그램",
            enabled: true
        },


        {
            title: "카카오톡 채널",
            url: "#",
            icon: "💬",
            description: "문의 및 소식",
            enabled: true
        },


        {
            title: "보유게임 목록",
            url: "#",
            icon: "🎲",
            description: "B1보드게임카페에서 보유하고 있는 게임",
            enabled: true
        },


        {
            title: "마작 순위",
            url: "#",
            icon: "🀄",
            description: "마작 관련 정보",
            enabled: true
        }

        /*
         * ========================================================
         * 링크를 더 추가하려면 여기 아래에 쉼표(,)를 넣고
         * 같은 형태의 블록을 추가하면 됩니다.
         *
         * 예:
         *
         * ,
         * {
         *     title: "새로운 링크",
         *     url: "https://example.com",
         *     icon: "⭐",
         *     description: "새로운 링크 설명",
         *     enabled: true
         * }
         *
         * ========================================================
         */
    ];


    /* ============================================================
       여기부터는 수정하지 않아도 됩니다.
       ============================================================ */


    /* ============================================================
       프로필 표시
       ============================================================ */

    const profileImage =
        document.getElementById("profileImage");

    const profileName =
        document.getElementById("profileName");

    const profileDescription =
        document.getElementById("profileDescription");

    const footer =
        document.getElementById("footer");


    profileName.textContent = SITE.name;

    profileDescription.innerHTML = SITE.description;

    footer.textContent = SITE.footer;


    /*
     * 프로필 이미지가 있는 경우
     */

    if (SITE.image && SITE.image.trim() !== "") {

        const image =
            document.createElement("img");

        image.src = SITE.image;
        image.alt = SITE.name;

        image.onload = function () {
            profileImage.innerHTML = "";
            profileImage.appendChild(image);
        };

        /*
         * 이미지 로딩 실패 시 기본 아이콘
         */

        image.onerror = function () {
            profileImage.innerHTML =
                '<div class="profile-placeholder">' +
                escapeHtml(SITE.placeholderIcon) +
                '</div>';
        };

    } else {

        /*
         * 이미지가 없으면 기본 아이콘
         */

        profileImage.innerHTML =
            '<div class="profile-placeholder">' +
            escapeHtml(SITE.placeholderIcon) +
            '</div>';
    }


    /* ============================================================
       링크 생성
       ============================================================ */

    const linksContainer =
        document.getElementById("links");


    LINKS
        .filter(link => link.enabled !== false)
        .forEach(link => {

            const anchor =
                document.createElement("a");

            anchor.className = "link";

            anchor.href = link.url;


            /*
             * 외부 링크는 새 탭에서 열기
             */

            if (link.newTab !== false) {
                anchor.target = "_blank";
                anchor.rel = "noopener noreferrer";
            }


            /*
             * 아이콘
             */

            const icon =
                document.createElement("div");

            icon.className = "link-icon";

            icon.textContent =
                link.icon || "🔗";

            icon.setAttribute(
                "aria-hidden",
                "true"
            );


            /*
             * 텍스트 영역
             */

            const content =
                document.createElement("div");

            content.className =
                "link-content";


            /*
             * 제목
             */

            const title =
                document.createElement("div");

            title.className =
                "link-title";

            title.textContent =
                link.title;


            content.appendChild(title);


            /*
             * 설명이 있을 경우에만 표시
             */

            if (
                link.description &&
                link.description.trim() !== ""
            ) {

                const description =
                    document.createElement("div");

                description.className =
                    "link-description";

                description.textContent =
                    link.description;

                content.appendChild(description);
            }


            /*
             * 오른쪽 점 3개
             */

            const more =
                document.createElement("div");

            more.className =
                "link-more";

            more.textContent =
                "···";

            more.setAttribute(
                "aria-hidden",
                "true"
            );


            /*
             * 링크 조립
             */

            anchor.appendChild(icon);
            anchor.appendChild(content);
            anchor.appendChild(more);

            linksContainer.appendChild(anchor);
        });


    /* ============================================================
       HTML 특수문자 처리
       
       프로필 placeholder 같은 곳에서
       예기치 않은 HTML 해석을 방지합니다.
       ============================================================ */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* ============================================================
       링크가 하나도 없을 경우
       ============================================================ */

    if (linksContainer.children.length === 0) {

        linksContainer.innerHTML =
            '<div style="' +
            'text-align:center;' +
            'padding:30px 10px;' +
            'color:#999;' +
            'font-size:14px;' +
            '">' +
            '등록된 링크가 없습니다.' +
            '</div>';
    }

</script>

</body>
</html>
